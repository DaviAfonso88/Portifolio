openapi: 3.0.3
info:
  title: DaviDev API
  version: 1.0.0
  description: API REST do Portfólio, Blog e CMS DaviDev (Fastify Serverless em Arquitetura Hexagonal).
servers:
  - url: /api/v1
    description: Servidor da API na mesma origem (Vercel)

paths:
  /health:
    get:
      summary: Health check básico
      description: Retorna o status de saúde da função serverless sem consultar o banco de dados.
      responses:
        '200':
          description: Serviço operando normalmente.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, timestamp]
                properties:
                  status: { type: string, example: "ok" }
                  version: { type: string, example: "1.0.0" }
                  timestamp: { type: string, format: date-time }

  /posts:
    get:
      summary: Listar posts publicados
      description: Retorna lista paginada de artigos com status 'publicado' no locale especificado.
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [pt-BR, en]
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: tag
          in: query
          required: false
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string, default: "publishedAt:desc" }
      responses:
        '200':
          description: Lista de posts publicados.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/ValidationError'

  /posts/{locale}/{slug}:
    get:
      summary: Obter detalhe de post publicado por slug
      description: Retorna o conteúdo Markdown completo de um post publicado. Se o slug for histórico, retorna HTTP 301 com o cabeçalho Location apontando para o slug atual.
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
            enum: [pt-BR, en]
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Post encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '301':
          description: Redirecionamento permanente para slug atualizado.
          headers:
            Location:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      summary: Listar categorias públicas
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [pt-BR, en]
      responses:
        '200':
          description: Lista de categorias com contagem de posts publicados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxonomyItem'

  /tags:
    get:
      summary: Listar tags públicas
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            type: string
            enum: [pt-BR, en]
      responses:
        '200':
          description: Lista de tags com contagem de posts publicados.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxonomyItem'

  /contact:
    post:
      summary: Enviar mensagem de contato
      description: Valida o captcha Turnstile, persiste a mensagem no banco de dados e enfileira notificação por e-mail via Resend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Mensagem persistida com sucesso.
          content:
            application/json:
              schema:
                type: object
                required: [id, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  createdAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      summary: Autenticação administrativa
      description: Valida credenciais do administrador. Retorna Access Token em JSON e grava Refresh Token em cookie HttpOnly com flag SameSite=Strict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login bem-sucedido.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Cookie HttpOnly Secure SameSite=Strict contendo o Refresh Token.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, example: 900 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      summary: Renovação de sessão (Token Rotation)
      description: Lê o Refresh Token via cookie HttpOnly, revoga o hash no banco, grava um novo hash e emite novo par de tokens.
      responses:
        '200':
          description: Token renovado com sucesso.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, example: 900 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Encerramento de sessão
      description: Invalida o hash do Refresh Token no banco de dados e limpa o cookie do navegador.
      responses:
        '204':
          description: Sessão encerrada.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Expira o cookie de autenticação.

  /admin/posts:
    get:
      summary: Listar posts no painel administrativo
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10 }
        - name: status
          in: query
          schema:
            type: string
            enum: [rascunho, publicado]
        - name: locale
          in: query
          schema:
            type: string
            enum: [pt-BR, en]
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Criar novo post
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /admin/posts/trash:
    get:
      summary: Listar posts na lixeira
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /admin/posts/{id}:
    get:
      summary: Obter post administrativo por ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualizar post existente
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      summary: Excluir definitivamente post a partir da lixeira
      description: Apaga fisicamente o registro do banco de dados com cascata em versões, slugs e tags.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Post excluído fisicamente com sucesso.
        '422':
          description: Post não está na lixeira (BR-007).
          $ref: '#/components/responses/Unprocessable'

  /admin/posts/{id}/publish:
    post:
      summary: Publicar post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [id, status, publishedAt, currentVersion, slug]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, example: "publicado" }
                  publishedAt: { type: string, format: date-time }
                  currentVersion: { type: integer }
                  slug: { type: string }
        '422':
          $ref: '#/components/responses/Unprocessable'

  /admin/posts/{id}/unpublish:
    post:
      summary: Despublicar post (retornar para rascunho)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Post retornado para rascunho.

  /admin/posts/{id}/trash:
    post:
      summary: Mover post para a lixeira
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Post movido para lixeira.

  /admin/posts/{id}/restore:
    post:
      summary: Restaurar post da lixeira
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Post restaurado ao estado anterior.
        '409':
          description: Slug já ocupado por outro artigo (BR-008).
          $ref: '#/components/responses/Conflict'

  /admin/posts/{id}/versions:
    get:
      summary: Listar histórico de versões do post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostVersionSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /admin/categories:
    get:
      summary: Listar categorias para o painel admin
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminCategoryItem'
    post:
      summary: Criar categoria
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryItem'

  /admin/categories/{id}:
    put:
      summary: Atualizar categoria
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryItem'
    delete:
      summary: Excluir categoria
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Categoria excluída com sucesso.
        '409':
          description: Categoria em uso por posts (BR-009).
          $ref: '#/components/responses/Conflict'

  /admin/tags:
    get:
      summary: Listar tags para o painel admin
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminCategoryItem'
    post:
      summary: Criar tag
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryItem'

  /admin/tags/{id}:
    put:
      summary: Atualizar tag
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryItem'
    delete:
      summary: Excluir tag
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Tag excluída com sucesso.
        '409':
          description: Tag em uso por posts (BR-009).
          $ref: '#/components/responses/Conflict'

  /admin/contact-messages:
    get:
      summary: Listar mensagens de contato recebidas
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10 }
        - name: pending
          in: query
          schema: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactMessageItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Erro de validação de schema (Zod).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token inválido, expirado ou ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado ou não publicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: "Conflito de integridade ou unicidade (ex: slug duplicado)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: "Violação de regra de negócio (ex: campos faltantes para publicação)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Limite de requisições excedido.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Erro interno inesperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 10 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 5 }

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string, example: "PUBLISH_REQUIREMENTS_NOT_MET" }
        message: { type: string, example: "Para publicar, preencha: resumo, categoria." }
        details: { type: object, nullable: true }
        traceId: { type: string, example: "01J8ZK9Q2M4N6P8R0S2T4V6X8Z" }

    PostSummary:
      type: object
      required: [id, title, slug, locale, excerpt, category, tags, publishedAt, updatedAt, hasTranslation]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        locale: { type: string, enum: [pt-BR, en] }
        excerpt: { type: string }
        coverImageUrl: { type: string, nullable: true }
        category:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        tags:
          type: array
          items:
            type: object
            required: [id, name, slug]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
        publishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        hasTranslation: { type: boolean }

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required: [content, currentVersion, translationGroupId]
          properties:
            content: { type: string, description: "Corpo do artigo em Markdown" }
            currentVersion: { type: integer }
            translationGroupId: { type: string, format: uuid }
            translation:
              type: object
              nullable: true
              required: [locale, slug]
              properties:
                locale: { type: string, enum: [pt-BR, en] }
                slug: { type: string }

    PostVersionSummary:
      type: object
      required: [versionNumber, title, excerpt, createdAt]
      properties:
        versionNumber: { type: integer }
        title: { type: string }
        excerpt: { type: string }
        createdAt: { type: string, format: date-time }

    TaxonomyItem:
      type: object
      required: [id, name, slug, postCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        postCount: { type: integer }

    AdminCategoryItem:
      type: object
      required: [id, namePtBr, nameEn, slugPtBr, slugEn]
      properties:
        id: { type: string, format: uuid }
        namePtBr: { type: string }
        nameEn: { type: string }
        slugPtBr: { type: string }
        slugEn: { type: string }

    AdminCategoryInput:
      type: object
      required: [namePtBr, nameEn, slugPtBr, slugEn]
      properties:
        namePtBr: { type: string, minLength: 2, maxLength: 60 }
        nameEn: { type: string, minLength: 2, maxLength: 60 }
        slugPtBr: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        slugEn: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }

    CreatePostInput:
      type: object
      required: [title, locale, excerpt, content, categoryId, tagIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", nullable: true }
        locale: { type: string, enum: [pt-BR, en] }
        excerpt: { type: string, minLength: 1, maxLength: 320 }
        content: { type: string, minLength: 1 }
        coverImageUrl: { type: string, nullable: true }
        categoryId: { type: string, format: uuid }
        tagIds:
          type: array
          items: { type: string, format: uuid }
          maxItems: 10
        translationGroupId: { type: string, format: uuid, nullable: true }

    ContactInput:
      type: object
      required: [name, email, message, locale, captchaToken]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        subject: { type: string, maxLength: 160, nullable: true }
        message: { type: string, minLength: 10, maxLength: 5000 }
        locale: { type: string, enum: [pt-BR, en] }
        captchaToken: { type: string }

    ContactMessageItem:
      type: object
      required: [id, name, email, message, locale, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        subject: { type: string, nullable: true }
        message: { type: string }
        locale: { type: string, enum: [pt-BR, en] }
        emailNotifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
