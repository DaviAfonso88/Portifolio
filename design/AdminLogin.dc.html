<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #F4F0E9; color: #1C1A17; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #A6482C; text-decoration: none; }
    a:hover { color: #7E351F; text-decoration: underline; }
  </style>
</helmet>

<div style="min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 48px;">
  <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 26px;">

    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; color: #1C1A17;">davidev</span>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #857D74;">Painel administrativo</span>
    </div>

    <form style="background: #FFFFFF; border: 1px solid #E4DFD7; border-radius: 8px; padding: 34px; display: flex; flex-direction: column; gap: 20px;">

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 14px; font-weight: 500; color: #38332E;">E-mail</label>
        <input type="text" value="davi@davidev.net.br" style="height: 46px; padding: 0 14px; border: 1px solid #D9D2C8; border-radius: 4px; background: #FFFFFF; font-family: Archivo, system-ui, sans-serif; font-size: 15px; color: #1C1A17;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 14px; font-weight: 500; color: #38332E;">Senha</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input type="password" value="••••••••••••" style="width: 100%; height: 46px; padding: 0 44px 0 14px; border: 1px solid #D9D2C8; border-radius: 4px; background: #FFFFFF; font-family: Archivo, system-ui, sans-serif; font-size: 15px; color: #1C1A17;">
          <span style="position: absolute; right: 13px; display: flex; color: #857D74;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </span>
        </div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 11px; background: #FDF6F4; border: 1px solid #EFD8D1; border-radius: 4px; padding: 13px 15px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5442B" stroke-width="1.75" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16h.01"></path></svg>
        <span style="font-size: 13.5px; line-height: 1.55; color: #8C3721;">E-mail ou senha inválidos.</span>
      </div>

      <button style="height: 48px; background: #1C1A17; color: #FAF8F4; border: none; border-radius: 4px; font-family: Archivo, system-ui, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer;">Entrar</button>

    </form>

    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #A29A90; text-align: center; line-height: 1.7;">Área restrita ao administrador.<br>Tentativas são limitadas a 5 a cada 15 minutos.</span>
      <a href="#" style="font-size: 13px; color: #857D74;">← Voltar ao site</a>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
